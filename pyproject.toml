[project]
name = "erithm"
version = "0.1.0"
description = "Taint-analysis firewall for LLM tool-calling agents. Detects prompt injection via tool output before it reaches privileged sinks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ace" },
]
keywords = [
    "llm",
    "security",
    "prompt-injection",
    "taint-analysis",
    "opentelemetry",
    "agent-security",
    "firewall",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "networkx>=3.1",
    "click>=8.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
erithm = "erithm.cli:main"

[project.urls]
Homepage = "https://github.com/Sanyog29/Erithm"
Repository = "https://github.com/Sanyog29/Erithm"
Issues = "https://github.com/Sanyog29/Erithm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["erithm"]
omit = ["tests/*"]

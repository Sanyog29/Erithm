# ── Erithm CI — Test, Build, Publish ───────────────────────────────────────
# Runs on every push to main and on pull requests.
#
# Jobs:
#   test    → pytest + coverage (Python 3.11)
#   publish → build container image and push to ghcr.io (main branch only)
#
# Container image: ghcr.io/sanyog29/erithm:latest
# Pull:  docker pull ghcr.io/sanyog29/erithm:latest
# Run:   docker run --rm -v ./trace.json:/data/trace.json:ro \
#                   ghcr.io/sanyog29/erithm:latest analyze /data/trace.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # sanyog29/erithm

jobs:
  # ── Job 1: Run tests ──────────────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests with coverage
        run: uv run --system pytest tests/ -v --cov=erithm --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 2: Build & publish container ─────────────────────────────────────
  publish:
    name: Build & Publish Container
    runs-on: ubuntu-latest
    needs: test                  # Only publish if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write            # Required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "## 🛡️ Erithm Container Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/sanyog29/erithm:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull and run:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'docker pull ghcr.io/sanyog29/erithm:latest' >> $GITHUB_STEP_SUMMARY
          echo 'docker run --rm -v ./trace.json:/data/trace.json:ro \' >> $GITHUB_STEP_SUMMARY
          echo '  ghcr.io/sanyog29/erithm:latest analyze /data/trace.json' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
